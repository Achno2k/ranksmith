display_information:
  name: RankSmith
  description: SEO content jobs with human approval gates
  background_color: "#1f2933"

features:
  bot_user:
    display_name: RankSmith
    always_online: false
  slash_commands:
    - command: /seo
      description: Start an SEO content job
      usage_hint: "[topic] — leave empty to let it discover one"
      should_escape: false

oauth_config:
  scopes:
    bot:
      # post job updates into the channel and the job thread
      - chat:write
      # receive the /seo slash command
      - commands
      # attach research documents to the job thread for review
      - files:write
      # accept documents and screenshots as future job or revision context
      - files:read
      # resolve approver IDs to readable names in future audit and review views
      - users:read
      # support conversational status and control commands via @RankSmith
      - app_mentions:read
      # mark job messages with compact processing, completion, and failure states
      - reactions:write
      # read thread replies, which are how feedback is given
      - channels:history
      - groups:history

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
